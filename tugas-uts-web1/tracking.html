<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lacak pengiriman dengan nomor Delivery Order.">
  <title>Tracking Pengiriman | Pustaka Kampus</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-halaman="tracking">
  <header class="topbar">
    <div class="container topbar-isi">
      <a class="brand" href="dashboard.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>Pustaka Kampus</span></a>
      <nav class="nav" aria-label="Navigasi utama">
        <a href="dashboard.html">Dashboard</a>
        <a href="stok.html">Stok</a>
        <a href="checkout.html">Pemesanan <span class="badge-nav" id="badgeKeranjang" hidden>0</span></a>
        <a href="tracking.html" aria-current="page">Tracking</a>
        <a href="laporan.html">Laporan</a>
        <a href="riwayat.html">Riwayat</a>
      </nav>
      <div class="akun">
        <span id="namaPengguna"></span>
        <button type="button" class="btn btn-garis btn-kecil" id="btnLogout">Keluar</button>
      </div>
    </div>
  </header>

  <main class="konten">
    <div class="container">
      <header class="judul-halaman">
        <h1>Tracking pengiriman</h1>
        <p>Masukkan nomor Delivery Order untuk melihat status paket.</p>
      </header>

      <section class="panel" aria-labelledby="hCari">
        <h2 id="hCari" class="sr-only">Cari pengiriman</h2>
        <form id="formTracking" novalidate>
          <div class="cari-baris">
            <div class="field">
              <label for="nomorDO">Nomor Delivery Order</label>
              <input type="text" id="nomorDO" name="nomorDO" inputmode="numeric" placeholder="20230012" autocomplete="off">
              <small class="pesan-error" role="alert"></small>
            </div>
            <button type="submit" class="btn btn-primer" style="margin-top:1.6rem">Cari</button>
          </div>
        </form>
        <div class="contoh-do">Coba nomor contoh:
          <button type="button" class="btn btn-garis btn-kecil" data-do="20230012">20230012</button>
          <button type="button" class="btn btn-garis btn-kecil" data-do="20230013">20230013</button>
        </div>
      </section>

      <div id="hasilTracking" aria-live="polite"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>Pustaka Kampus, tugas UTS Pemrograman Web 1. Data berasal dari js/data.js, tanpa server.</p></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
